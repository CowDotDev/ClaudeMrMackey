name: PR AI Review

# First gate on every PR before a human merges it - see docs/ARCHITECTURE.md. This is a
# gate of convenience, not the security boundary: the human merge is what actually matters.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Review PR with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as the first automated gate before a human merges it. A
            human will read your review and make the final call - your job is to give them
            what they need to decide quickly, not to approve or block anything yourself.

            Check for:
            - Correctness bugs and edge cases the diff doesn't handle
            - Security issues (see CLAUDE.md and the OWASP Top 10 guidance in the system
              instructions this project's agents follow)
            - Whether the change stayed scoped to what its description says it does, per
              CLAUDE.md's "keep changes scoped" rule - flag unrelated refactors, dependency
              bumps, or scope creep
            - Whether it touches secrets, CI permissions, or auth in ways CLAUDE.md says
              automated changes should not

            Post your findings as a single PR comment. Be concise - a short list of concrete
            issues (with file/line references) is more useful than a long narrative.
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*)"
